[package]
name = "minimal"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "minimal"
path = "main.rs"

[dependencies]
bevy = { workspace = true, features = ["default"] }
# Core only on QuickJS — no feature elements, no devtools, no V8: the smallest
# bevy-react build (CI checks no V8 crate is in its tree).
bevy-react = { workspace = true, features = ["quickjs"] }

