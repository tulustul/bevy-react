[package]
name = "coldwake"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "coldwake"
path = "main.rs"

[features]
# The JS engine, chosen at compile time: V8 by default; QuickJS-only (no V8
# downloaded or linked) with `cargo run -p coldwake --no-default-features
# --features quickjs`.
default = ["v8"]
v8 = ["bevy-react/v8"]
quickjs = ["bevy-react/quickjs"]

[dependencies]
bevy = { workspace = true, features = ["default"] }
# Every bevy-react feature but the engine: `<surface>` for every hologram,
# `<portal>` for the item preview and the map, `<svg>` and `<canvas>` inside
# them.
bevy-react = { workspace = true, features = [
    "svg", "anchor", "canvas", "portal", "surface", "devtools", "custom_cursor",
] }
# For the nested payload types the macros don't derive themselves.
serde = { workspace = true }
ts-rs = { workspace = true }
