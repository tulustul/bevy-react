[package]
name = "layers-stress"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "layers-stress"
path = "main.rs"

[dependencies]
bevy = { workspace = true, features = ["default"] }
# Core plus devtools (the benchmarks use no feature elements), on both JS
# engines: `--engine v8|quickjs` picks one, so both run the same binary.
bevy-react = { workspace = true, features = ["devtools", "v8", "quickjs"] }

