[package]
name = "demos"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "demos"
path = "main.rs"

[dependencies]
bevy = { workspace = true, features = ["default"] }
# Every bevy-react feature (the defaults): the gallery shows them all.
bevy-react = { workspace = true, features = ["default"] }
serde = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
bevy_react_core = { workspace = true, features = ["test_util"] }
crossbeam-channel = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
