[package]
name = "demos"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "demos"
path = "main.rs"

[dependencies]
bevy = { workspace = true }
bevy_react_core = { workspace = true }
bevy_react_svg = { workspace = true }
bevy_react_anchor = { workspace = true }
bevy_react_canvas = { workspace = true }
bevy_react_portal = { workspace = true }
bevy_react_surface = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
crossbeam-channel = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Parse/validate the example WGSL in tests (the same copy bevy's wgpu uses).
naga = { version = "29.0", features = ["wgsl-in"] }
