[package]
name = "demos"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "demos"
path = "main.rs"

[features]
# The JS engine, chosen at compile time: V8 by default; QuickJS-only (no V8
# downloaded or linked) with `cargo run -p demos --no-default-features
# --features quickjs`.
default = ["v8"]
v8 = ["bevy-react/v8"]
quickjs = ["bevy-react/quickjs"]

[dependencies]
bevy = { workspace = true, features = ["default"] }
# Every bevy-react feature but the engine: the gallery shows them all.
bevy-react = { workspace = true, features = [
    "svg", "anchor", "canvas", "portal", "surface", "devtools", "custom_cursor",
] }
serde = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
bevy_react_core = { workspace = true, features = ["test_util"] }
crossbeam-channel = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
