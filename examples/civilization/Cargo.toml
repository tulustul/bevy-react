[package]
name = "civilization"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "civilization"
path = "main.rs"

[features]
# The JS engine, chosen at compile time: V8 by default; QuickJS-only (no V8
# downloaded or linked) with `cargo run -p civilization --no-default-features
# --features quickjs`.
default = ["v8"]
v8 = ["bevy-react/v8"]
quickjs = ["bevy-react/quickjs"]

[dependencies]
bevy = { workspace = true, features = ["default"] }
# Every bevy-react feature but the engine: `<anchor>` for the city banners,
# unit flags and the tile tooltip, `<portal>` for the minimap, `<svg>` for
# the icons and the charts.
bevy-react = { workspace = true, features = [
    "svg", "anchor", "canvas", "portal", "surface", "devtools", "custom_cursor",
] }
# For the nested payload types (`TileInfo`, `CityInfo`, …) the macros don't
# derive themselves.
serde = { workspace = true }
ts-rs = { workspace = true }
