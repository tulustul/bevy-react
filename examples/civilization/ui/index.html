<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Civilization · bevy-react</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        /* The camera's sea (camera.rs), so the page never flashes another
           color before the first frame. */
        background: #0d2136;
        overflow: hidden;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        outline: none;
        /* The app owns every gesture: no browser scroll or pinch-zoom. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // Boot order matters: `init()` runs main.rs, whose ReactUiPlugin
      // installs `globalThis.__bevyHost`; vendor.js reads it when it loads,
      // and app.js takes React from vendor.js.
      import init from "./civilization.js";
      await init();
      await loadScript("./vendor.js");
      await loadScript("./app.js");

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = () => reject(new Error(`failed to load ${src}`));
          document.body.appendChild(s);
        });
      }
    </script>
  </body>
</html>
