[workspace]
resolver = "3"
members = [
    "crates/bevy-react",
    "crates/core",
    "crates/macros",
    "crates/svg",
    "crates/anchor",
    "crates/canvas",
    "crates/portal",
    "crates/surface",
    "examples/demos",
    "examples/minimal",
    "examples/stress",
    "examples/layers-stress",
    "examples/arcana",
    "examples/atrium",
    "examples/civilization",
    "examples/cyberpunk",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Mateusz Tomczyk <mateusz.tomczyk.tul@gmail.com>"]
repository = "https://github.com/tulustul/bevy-react"
homepage = "https://github.com/tulustul/bevy-react"

[workspace.dependencies]
accesskit = "0.24"
# Libraries take bevy with its defaults OFF and list exactly the features
# their code needs (each crate's own manifest) — a library that leaves bevy's
# defaults on forces audio/gltf/pbr/winit/… onto every app. The examples are
# apps: they switch the defaults back on (`features = ["default"]`).
bevy = { version = "0.19", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5.15"
deno_core = "0.404.0"
# The `JsErrorClass` types deno_core throws into JS (`JsErrorBox`); the version
# deno_core 0.404 itself depends on.
deno_error = "0.7"
# Type-erased serde: the style registry decodes each property's value
# straight into its registered type (`crates/core/src/style/codec.rs`). The
# version bevy_reflect already pulls, so it adds nothing to the tree.
erased-serde = "0.4"
# Inline small-value storage for the style store (`crates/core/src/style/store.rs`):
# a property value of ≤ 32 bytes lives in its entry, larger ones on the heap.
smallbox = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny-skia = "0.12"
# SVG parse (usvg) + CPU raster (resvg). Default features off: we skip the
# `text` feature (fontdb/rustybuzz font machinery — SVG text unsupported in v1)
# and resvg's `raster-images` (embedded png/jpeg/gif/webp bitmaps: resvg warns
# and skips them, vector content still renders; re-enable with
# `features = ["raster-images"]` — no font deps — if embedded bitmaps are ever
# needed). resvg renders into the same tiny-skia 0.12 the canvas module uses.
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }
# SVG micro-grammar parsers (path `d`, transform lists, viewBox) for the JSX
# shape protocol. The resvg-family crate usvg 0.47 already depends on — same
# version, so it adds nothing to the tree.
svgtypes = "0.16"
# 2D curve math for SVG hit-testing (winding + nearest-point). Pinned to the
# exact version svgtypes/usvg already pull so the tree keeps a single copy.
kurbo = "0.13.1"
tracing = "0.1"
tokio = { version = "1.52.3", features = ["rt", "macros", "sync"] }
ts-rs = "10"
proc-macro2 = "1"
# The macros resolve the path of the crate they expand against from the
# caller's manifest (`bevy-react` or `bevy_react_core`).
proc-macro-crate = "3"
quote = "1"
syn = "2"

# Web (wasm32) host dependencies — see `crates/core/src/host/web.rs`.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = "0.3"

# The workspace's own crates, released in lock-step. Defaults OFF here so a
# member opts in explicitly: a feature crate that left core's defaults on
# would switch `devtools` back on under a facade build that turned it off
# (and a member can re-enable defaults, never disable inherited ones).
bevy-react-macros = { path = "crates/macros", version = "0.7.0" }
bevy_react_core = { path = "crates/core", version = "0.7.0", default-features = false }
bevy_react_svg = { path = "crates/svg", version = "0.7.0", default-features = false }
bevy_react_anchor = { path = "crates/anchor", version = "0.7.0", default-features = false }
bevy_react_canvas = { path = "crates/canvas", version = "0.7.0", default-features = false }
bevy_react_portal = { path = "crates/portal", version = "0.7.0", default-features = false }
bevy_react_surface = { path = "crates/surface", version = "0.7.0", default-features = false }
bevy-react = { path = "crates/bevy-react", version = "0.7.0", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
