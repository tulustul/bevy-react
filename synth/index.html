<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synth · bevy-react</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        /* The backdrop camera's clear color (wires/backdrop.rs), so the page
           never flashes another color before the first frame. */
        background: #080a10;
        overflow: hidden;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        outline: none;
        /* The app owns every gesture: no browser scroll or pinch-zoom. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
<!--
  The loading spinner of every web build: build-web.mjs puts this first in
  the page's <body>. It sits UNDER the canvas, which stays transparent until
  Bevy presents its first frame, so the app's first frame covers it with no
  script deciding when. The spin is a transform, which the browser animates
  off the main thread: it keeps turning while the wasm compiles and Bevy
  builds the app.
-->
<style>
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    color: rgb(255 255 255 / 0.5);
    font:
      36px/1 system-ui,
      sans-serif;
    letter-spacing: 0.08em;
  }
  #loader::before {
    content: "";
    width: 64px;
    height: 64px;
    border: 5px solid rgb(255 255 255 / 0.12);
    border-top-color: rgb(255 255 255 / 0.7);
    border-radius: 50%;
    animation: loader-spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    #loader::before {
      animation-duration: 3s;
    }
  }
  @keyframes loader-spin {
    to {
      transform: rotate(1turn);
    }
  }
  /* Bevy appends its canvas after the loader: positioned, it paints above. */
  canvas {
    position: relative;
    z-index: 1;
  }
</style>
<div id="loader" role="status">Loading…</div>

    <script>
      // Browsers start an AudioContext suspended until the page gets a user
      // gesture, and Bevy's audio opens one at startup: keep every one the
      // app creates and resume them on input.
      {
        const audio = [];
        globalThis.AudioContext = new Proxy(AudioContext, {
          construct(target, args) {
            const context = new target(...args);
            audio.push(context);
            return context;
          },
        });
        for (const type of [
          "keydown",
          "pointerdown",
          "pointerup",
          "touchend",
        ]) {
          addEventListener(type, () => audio.forEach((c) => c.resume()));
        }
      }
    </script>
    <script type="module">
      // Boot order matters: `init()` runs main.rs, whose ReactUiPlugin
      // installs `globalThis.__bevyHost`; vendor.js reads it when it loads,
      // and app.js takes React from vendor.js.
      import init from "./synth.js";
      await init();
      await loadScript("./vendor.js");
      await loadScript("./app.js");

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = () => reject(new Error(`failed to load ${src}`));
          document.body.appendChild(s);
        });
      }
    </script>
  </body>
</html>
