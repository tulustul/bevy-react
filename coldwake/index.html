<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COLDWAKE · bevy-react</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        /* The station's fog (`FOG` in player/camera.rs), so the page never
           flashes another color before the first frame. */
        background: #02050a;
        overflow: hidden;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        outline: none;
        /* The app owns every gesture: no browser scroll or pinch-zoom. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script>
      // Browsers start an AudioContext suspended until the page gets a user
      // gesture, and Bevy's audio opens one at startup: keep every one the
      // app creates and resume them on input.
      {
        const audio = [];
        globalThis.AudioContext = new Proxy(AudioContext, {
          construct(target, args) {
            const context = new target(...args);
            audio.push(context);
            return context;
          },
        });
        for (const type of [
          "keydown",
          "pointerdown",
          "pointerup",
          "touchend",
        ]) {
          addEventListener(type, () => audio.forEach((c) => c.resume()));
        }
      }
    </script>
    <script type="module">
      // Boot order matters: `init()` runs main.rs, whose ReactUiPlugin
      // installs `globalThis.__bevyHost`; vendor.js reads it when it loads,
      // and app.js takes React from vendor.js.
      import init from "./coldwake.js";
      await init();
      await loadScript("./vendor.js");
      await loadScript("./app.js");

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = () => reject(new Error(`failed to load ${src}`));
          document.body.appendChild(s);
        });
      }
    </script>
  </body>
</html>
