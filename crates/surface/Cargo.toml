[package]
name = "bevy_react_surface"
version.workspace = true
edition.workspace = true
description = "The <surface> element: React UI rendered into offscreen textures for bevy_react_core."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["bevy", "react", "surface", "ui", "gamedev"]
categories = ["gui", "game-development"]

[lib]
name = "bevy_react_surface"
path = "src/lib.rs"

# Mirrors the core's default `devtools` feature (the diag-flagged tests
# assert on the structured warnings it collects).
[features]
default = ["devtools"]
devtools = ["bevy_react_core/devtools"]

[dependencies]
bevy = { workspace = true }
bevy_react_core = { workspace = true }

[dev-dependencies]
bevy_react_core = { workspace = true, features = ["test-util"] }
crossbeam-channel = { workspace = true }
serde_json = { workspace = true }
