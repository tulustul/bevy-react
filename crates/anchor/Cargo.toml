[package]
name = "bevy_react_anchor"
version.workspace = true
edition.workspace = true
description = "The <anchor> element: world-anchored UI overlays for bevy_react_core."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["bevy", "react", "anchor", "ui", "gamedev"]
categories = ["gui", "game-development"]

[lib]
name = "bevy_react_anchor"
path = "src/lib.rs"

[dependencies]
bevy = { workspace = true }
bevy_react_core = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
bevy_react_core = { workspace = true, features = ["test-util"] }
crossbeam-channel = { workspace = true }
serde_json = { workspace = true }
