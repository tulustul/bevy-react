[package]
name = "bevy_react_svg"
version.workspace = true
edition.workspace = true
description = "The JSX <svg> element and shape intrinsics for bevy_react_core."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["bevy", "react", "svg", "ui", "gamedev"]
categories = ["gui", "game-development"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "bevy_react_svg"
path = "src/lib.rs"

# Mirrors the core's default `devtools` feature (the diag-flagged tests
# assert on the structured warnings it collects).
[features]
default = ["devtools"]
devtools = ["bevy_react_core/devtools"]

[dependencies]
# Exactly what the code references (see the core manifest).
bevy = { workspace = true, features = ["bevy_ui", "bevy_picking", "bevy_camera", "bevy_color", "bevy_image", "bevy_asset"] }
tracing = { workspace = true }
bevy_react_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The attribute codecs' decode signature (type-erased serde).
tiny-skia = { workspace = true }
# SVG micro-grammar parsers (path `d`, transform lists, viewBox).
svgtypes = { workspace = true }
# 2D curve math for hit-testing (winding + nearest-point).
kurbo = { workspace = true }

[dev-dependencies]
bevy_react_core = { workspace = true, features = ["test_util"] }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
