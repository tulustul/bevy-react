[package]
name = "bevy_react_canvas"
version.workspace = true
edition.workspace = true
description = "The <canvas> element: a retained CPU-rastered drawing surface for bevy_react_core."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["bevy", "react", "canvas", "ui", "gamedev"]
categories = ["gui", "game-development"]

[lib]
name = "bevy_react_canvas"
path = "src/lib.rs"

[dependencies]
# Exactly what the code references (see the core manifest).
bevy = { workspace = true, features = ["bevy_ui", "bevy_image", "bevy_color"] }
bevy_react_core = { workspace = true }
serde = { workspace = true }
tiny-skia = { workspace = true }
# The `onResize` payload's TypeScript type (the generated JSX typing).
ts-rs = { workspace = true }

[dev-dependencies]
bevy_react_core = { workspace = true, features = ["test_util"] }
crossbeam-channel = { workspace = true }
serde_json = { workspace = true }
