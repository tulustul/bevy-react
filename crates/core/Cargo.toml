[package]
name = "bevy-react"
version.workspace = true
edition.workspace = true
description = "Drive bevy_ui from a React app over an embedded V8 runtime."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["bevy", "react", "ui", "gamedev", "gui"]
categories = ["gui", "game-development"]

# docs.rs documents the default (native) target. `rusty_v8` (via deno_core) skips
# its network V8 download when the `DOCS_RS` env var is set, so the native build
# succeeds without network access.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "bevy_react"
path = "src/lib.rs"

# The example and its React UI live at the repo root (`examples/`), so declare it
# explicitly rather than relying on the default `examples/` directory lookup.
[[example]]
name = "demos"
path = "../../examples/demos/main.rs"
# The example carries unit tests (`--shoot` arg parsing, camera grab rules);
# examples are compile-only by default, so opt them into `cargo test`.
test = true

# The benchmark / stress-test runner (see `examples/stress/`), declared explicitly
# for the same reason as `demos` (it lives at the repo root).
[[example]]
name = "stress"
path = "../../examples/stress/main.rs"

# Auto layer-promotion stress test (see `examples/layers-stress/`).
[[example]]
name = "layers-stress"
path = "../../examples/layers-stress/main.rs"

[[example]]
name = "minimal"
path = "../../examples/minimal/main.rs"

# The devtools inspector (auto-registered by `ReactUiPlugin`, `<root>`-hosted
# panel). A default feature: consumers get devtools in dev builds with zero
# setup (the plugin is inert in `--release` builds); size-conscious release
# builds compile it out with `default-features = false`.
[features]
default = ["devtools"]
devtools = []
# SVG `<text>` element support: pulls in usvg's font machinery (fontdb + a
# system-font scan). Off by default — most icon/illustration SVGs have no text.
# usvg splits the two halves: `text` is shaping (fontdb + rustybuzz),
# `system-fonts` is fontdb's filesystem scan — loading system fonts needs both.
svg-text = ["usvg/text", "usvg/system-fonts"]

[dependencies]
accesskit = { workspace = true }
anyhow = { workspace = true }
bevy = { workspace = true }
bevy-react-macros = { workspace = true }
bytemuck = { workspace = true }
crossbeam-channel = { workspace = true }
kurbo = { workspace = true }
resvg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
svgtypes = { workspace = true }
tiny-skia = { workspace = true }
usvg = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
uuid = { workspace = true }

# Native host: the embedded V8 isolate (deno_core) on a dedicated thread, driven by
# a tokio current-thread runtime. Neither builds for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
deno_core = { workspace = true }
tokio = { workspace = true }

# Web host: React runs in the browser's own engine, reached over wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["console"] }
console_error_panic_hook = { workspace = true }
# Bevy/rand pull `getrandom`; on wasm it needs the browser backend enabled (the
# `wasm_js` feature plus `--cfg getrandom_backend="wasm_js"`, set in .cargo/config.toml).
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
crossbeam-channel = { workspace = true }
# Parse/validate the crate's WGSL in unit tests. Already in the dependency
# tree via bevy's wgpu; the version requirement must keep resolving to that
# same copy.
naga = { version = "29.0", features = ["wgsl-in"] }
tokio = { workspace = true }
