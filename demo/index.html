<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bevy-react · demos (web)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* Phones: follow the browser chrome as the URL bar collapses
           (dvh), and keep pull-to-refresh / rubber-banding off the page. */
        height: 100dvh;
        /* The studio backdrop's base (ambient.wgsl), so the page never
           flashes a different dark before the first frame. */
        background: #090a0d;
        overflow: hidden;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        outline: none;
        /* The app owns every gesture: without this a phone browser turns
           touch drags into page scroll/pinch-zoom and double-taps into zoom. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
<!--
  The loading spinner of every web build: build-web.mjs puts this first in
  the page's <body>. It sits UNDER the canvas, which stays transparent until
  Bevy presents its first frame, so the app's first frame covers it with no
  script deciding when. The spin is a transform, which the browser animates
  off the main thread: it keeps turning while the wasm compiles and Bevy
  builds the app.
-->
<style>
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    color: rgb(255 255 255 / 0.5);
    font:
      36px/1 system-ui,
      sans-serif;
    letter-spacing: 0.08em;
  }
  #loader::before {
    content: "";
    width: 64px;
    height: 64px;
    border: 5px solid rgb(255 255 255 / 0.12);
    border-top-color: rgb(255 255 255 / 0.7);
    border-radius: 50%;
    animation: loader-spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    #loader::before {
      animation-duration: 3s;
    }
  }
  @keyframes loader-spin {
    to {
      transform: rotate(1turn);
    }
  }
  /* Bevy appends its canvas after the loader: positioned, it paints above. */
  canvas {
    position: relative;
    z-index: 1;
  }
</style>
<div id="loader" role="status">Loading…</div>

    <script type="module">
      // Boot order matters. The wasm module's `init()` runs the example's `main()`,
      // which builds the Bevy app and — inside ReactUiPlugin::build — installs
      // `globalThis.__bevyHost`, then schedules Bevy's frame loop and returns.
      import init from "./demos.js";
      await init();

      // Only now that `__bevyHost` exists do we load the React runtime + app.
      // They are classic IIFE bundles (vendor.js sets `globalThis.__bevyVendor`,
      // app.js consumes it); bridge.ts reads `__bevyHost` at evaluation time, so
      // vendor.js must run after `init()` and before app.js.
      await loadScript("./vendor.js");
      await loadScript("./app.js");

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = () => reject(new Error(`failed to load ${src}`));
          document.body.appendChild(s);
        });
      }
    </script>
  </body>
</html>
